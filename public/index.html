<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager - CRUD App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>📝 Task Manager</h1>
    <p class="subtitle">A simple CRUD app built with Node.js, Express &amp; SQLite</p>

    <!-- Form for Create / Update -->
    <form id="task-form">
      <input type="hidden" id="task-id" />

      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="Task title" required />
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" placeholder="Task description (optional)"></textarea>
      </div>

      <div class="field">
        <label for="status">Status</label>
        <select id="status">
          <option value="pending">Pending</option>
          <option value="in-progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="submit" id="submit-btn">Add Task</button>
        <button type="button" id="cancel-btn" class="hidden">Cancel</button>
      </div>
    </form>

    <h2>All Tasks</h2>
    <div id="task-list" class="task-list">
      <!-- tasks get rendered here -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
